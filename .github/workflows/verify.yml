name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: local
      DATABASE_URL: postgresql://unyon:unyon@127.0.0.1:5432/unyon_test?schema=public
      DIRECT_URL: postgresql://unyon:unyon@127.0.0.1:5432/unyon_test?schema=public
      TEST_DATABASE_URL: postgresql://unyon:unyon@127.0.0.1:5432/unyon_test?schema=public
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      FIREBASE_PROJECT_ID: unyon-mindanao-local
      LOCAL_SUPER_ADMIN_EMAIL: admin@unyon.local
      LOCAL_SUPER_ADMIN_NAME: Local Super Admin
      LOCAL_SUPER_ADMIN_PASSWORD: local-unyon-admin
      NEXT_PUBLIC_APP_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_FIREBASE_API_KEY: demo-api-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: unyon-mindanao-local.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: unyon-mindanao-local
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: unyon_test
          POSTGRES_PASSWORD: unyon
          POSTGRES_USER: unyon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U unyon -d unyon_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck
      - name: Test modules
        run: pnpm test
      - name: Apply database migrations
        run: pnpm db:migrate:deploy
      - name: Test integrations
        run: pnpm test:integration
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Build Next.js
        run: pnpm build
      - name: Build for Cloudflare Workers
        run: pnpm build:worker
      - name: Test browser journeys in Next.js and Workerd
        run: >-
          pnpm exec firebase emulators:exec --only auth
          --project unyon-mindanao-local
          "pnpm bootstrap:local && pnpm test:e2e && pnpm test:e2e:worker"
